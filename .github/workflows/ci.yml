name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7   # for the phone page syntax check
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt pyflakes
      - run: python -m pyflakes security.py server.py Kovrel.pyw vigem.py h264.py installer/setup.pyw installer/build.py tools tests
      # The checks that don't need a real screen, sound card or desktop session.
      - run: python tests/sec_test.py
      - run: python tests/migrate_test.py
      - run: python tests/remote_test.py
      - run: python tests/update_test.py
      - run: python tests/page_check.py
      - run: python tests/vigem_test.py
      - run: python tests/h264_test.py      # skips itself where Windows has no H.264 encoder
